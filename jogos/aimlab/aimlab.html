<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aim Trainer 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #111; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }

  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 20px; height: 20px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #00ff88;
  }
  #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
  #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
  #crosshair .dot {
    position: absolute; width: 4px; height: 4px; background: #fff;
    border-radius: 50%; left: 8px; top: 8px;
  }

  #hud {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 40px; color: #fff; font-size: 20px;
    text-shadow: 0 0 6px rgba(0,0,0,0.8); z-index: 10;
    user-select: none;
  }
  #hud div span { color: #00ff88; font-weight: bold; }

  #menu, #endScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10,10,15,0.92); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; gap: 18px;
  }
  #menu h1, #endScreen h1 {
    font-size: 48px; color: #00ff88; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(0,255,136,0.6);
  }
  #menu p, #endScreen p { font-size: 16px; color: #aaa; }
  button {
    background: #00ff88; color: #111; border: none; padding: 14px 32px;
    font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }
  button:hover { background: #00cc6e; transform: scale(1.05); }

  #sensRow { display: flex; align-items: center; gap: 10px; color: #ccc; font-size: 15px; }
  #sensRow input { accent-color: #00ff88; }

  #stats { display: flex; flex-direction: column; gap: 8px; font-size: 18px; }
  #stats span { color: #00ff88; font-weight: bold; }

  .hidden { display: none !important; }

  #hitmarker {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 30px; height: 30px; pointer-events: none; z-index: 15; opacity: 0;
  }
  #hitmarker::before, #hitmarker::after {
    content: ''; position: absolute; background: #ff3355; width: 3px; height: 14px;
  }
  #hitmarker::before { transform: rotate(45deg); left: 6px; top: 0; }
  #hitmarker::after  { transform: rotate(-45deg); right: 6px; top: 0; }
</style>
</head>
<body>

<div id="crosshair"><div class="dot"></div></div>
<div id="hitmarker"></div>

<div id="hud" class="hidden">
  <div>Score: <span id="scoreVal">0</span></div>
  <div>Tempo: <span id="timeVal">60</span></div>
  <div>Precisão: <span id="accVal">100%</span></div>
</div>

<div id="menu">
  <h1>AIM TRAINER 3D</h1>
  <p>Modo Gridshot — acerte o máximo de alvos em 60 segundos</p>
  <div id="sensRow">
    Sensibilidade: <input type="range" id="sensSlider" min="0.5" max="5" step="0.1" value="2">
    <span id="sensVal">2.0</span>
  </div>
  <button id="startBtn">CLIQUE PARA JOGAR</button>
</div>

<div id="endScreen" class="hidden">
  <h1>FIM DE JOGO</h1>
  <div id="stats"></div>
  <button id="restartBtn">JOGAR NOVAMENTE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================== CONFIGURAÇÕES ==================
const GAME_TIME = 60;          // duração da partida em segundos
const TARGET_LIFETIME = 1500;  // ms até o alvo desaparecer sozinho (conta como erro)
const TARGET_RADIUS = 0.4;
const SPAWN_DEPTH = -10;       // distância do alvo em relação ao jogador
const SPAWN_RANGE_X = 5.5;
const SPAWN_RANGE_Y = [0.5, 4.2];

// ================== ESTADO DO JOGO ==================
let scene, camera, renderer, raycaster;
let currentTarget = null;
let score = 0, hits = 0, misses = 0, shotsFired = 0;
let timeLeft = GAME_TIME;
let gameActive = false;
let timerInterval = null;
let sensitivity = 2.0;
let yaw = 0, pitch = 0;
const hitReactionTimes = [];
let targetSpawnTimestamp = 0;

// ================== ELEMENTOS DOM ==================
const menu = document.getElementById('menu');
const endScreen = document.getElementById('endScreen');
const hud = document.getElementById('hud');
const scoreVal = document.getElementById('scoreVal');
const timeVal = document.getElementById('timeVal');
const accVal = document.getElementById('accVal');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const sensSlider = document.getElementById('sensSlider');
const sensValLabel = document.getElementById('sensVal');
const hitmarker = document.getElementById('hitmarker');

sensSlider.addEventListener('input', () => {
  sensitivity = parseFloat(sensSlider.value);
  sensValLabel.textContent = sensitivity.toFixed(1);
});

// ================== INICIALIZAÇÃO DA CENA ==================
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a22);
  scene.fog = new THREE.Fog(0x1a1a22, 10, 30);

  camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 5);
  camera.rotation.order = 'YXZ';

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  raycaster = new THREE.Raycaster();

  // luzes
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // chão
  const floorGeo = new THREE.PlaneGeometry(40, 40);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a35 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // grid no chão (referência visual)
  const grid = new THREE.GridHelper(40, 40, 0x00ff88, 0x333344);
  grid.position.y = 0.01;
  scene.add(grid);

  // parede de fundo (onde os alvos aparecem)
  const wallGeo = new THREE.PlaneGeometry(20, 10);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x22222c });
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.set(0, 5, SPAWN_DEPTH - 0.5);
  scene.add(wall);

  // paredes laterais
  const sideGeo = new THREE.PlaneGeometry(30, 10);
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x1e1e26 });
  const leftWall = new THREE.Mesh(sideGeo, sideMat);
  leftWall.rotation.y = Math.PI / 2;
  leftWall.position.set(-10, 5, 0);
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(sideGeo, sideMat);
  rightWall.rotation.y = -Math.PI / 2;
  rightWall.position.set(10, 5, 0);
  scene.add(rightWall);

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ================== ALVOS ==================
function spawnTarget() {
  if (currentTarget) {
    scene.remove(currentTarget);
    currentTarget.geometry.dispose();
    currentTarget.material.dispose();
  }

  const geo = new THREE.SphereGeometry(TARGET_RADIUS, 24, 24);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xff3355,
    emissive: 0x551122,
    roughness: 0.4
  });
  const target = new THREE.Mesh(geo, mat);

  const x = (Math.random() * 2 - 1) * SPAWN_RANGE_X;
  const y = SPAWN_RANGE_Y[0] + Math.random() * (SPAWN_RANGE_Y[1] - SPAWN_RANGE_Y[0]);
  target.position.set(x, y, SPAWN_DEPTH);

  scene.add(target);
  currentTarget = target;
  targetSpawnTimestamp = performance.now();
}

function despawnAsMiss() {
  if (!currentTarget) return;
  misses++;
  scene.remove(currentTarget);
  currentTarget.geometry.dispose();
  currentTarget.material.dispose();
  currentTarget = null;
  updateHUD();
  if (gameActive) spawnTarget();
}

// ================== CONTROLES DE MOUSE (POINTER LOCK) ==================
function onMouseMove(e) {
  if (!gameActive) return;
  const sens = sensitivity * 0.002;
  yaw -= e.movementX * sens;
  pitch -= e.movementY * sens;
  pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

function onShoot() {
  if (!gameActive || document.pointerLockElement !== renderer.domElement) return;

  shotsFired++;
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);

  if (currentTarget) {
    const intersects = raycaster.intersectObject(currentTarget);
    if (intersects.length > 0) {
      hits++;
      score += 100;
      hitReactionTimes.push(performance.now() - targetSpawnTimestamp);
      showHitmarker();
      spawnTarget();
    } else {
      misses++;
    }
  } else {
    misses++;
  }
  updateHUD();
}

function showHitmarker() {
  hitmarker.style.opacity = '1';
  clearTimeout(showHitmarker._t);
  showHitmarker._t = setTimeout(() => hitmarker.style.opacity = '0', 120);
}

// ================== HUD ==================
function updateHUD() {
  scoreVal.textContent = score;
  timeVal.textContent = timeLeft;
  const acc = shotsFired > 0 ? (hits / shotsFired * 100) : 100;
  accVal.textContent = acc.toFixed(0) + '%';
}

// ================== FLUXO DO JOGO ==================
function startGame() {
  score = 0; hits = 0; misses = 0; shotsFired = 0;
  timeLeft = GAME_TIME;
  hitReactionTimes.length = 0;
  yaw = 0; pitch = 0;
  camera.rotation.set(0, 0, 0);

  menu.classList.add('hidden');
  endScreen.classList.add('hidden');
  hud.classList.remove('hidden');

  updateHUD();
  spawnTarget();

  renderer.domElement.requestPointerLock();
  gameActive = true;

  timerInterval = setInterval(() => {
    timeLeft--;
    updateHUD();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  gameActive = false;
  clearInterval(timerInterval);
  document.exitPointerLock();

  if (currentTarget) {
    scene.remove(currentTarget);
    currentTarget = null;
  }

  const acc = shotsFired > 0 ? (hits / shotsFired * 100) : 0;
  const avgReaction = hitReactionTimes.length
    ? (hitReactionTimes.reduce((a, b) => a + b, 0) / hitReactionTimes.length / 1000)
    : 0;

  document.getElementById('stats').innerHTML = `
    <p>Pontuação final: <span>${score}</span></p>
    <p>Alvos acertados: <span>${hits}</span></p>
    <p>Erros: <span>${misses}</span></p>
    <p>Precisão: <span>${acc.toFixed(1)}%</span></p>
    <p>Tempo médio de reação: <span>${avgReaction.toFixed(2)}s</span></p>
  `;

  hud.classList.add('hidden');
  endScreen.classList.remove('hidden');
}

// ================== EVENTOS ==================
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement) {
    document.addEventListener('mousemove', onMouseMove);
  } else {
    document.removeEventListener('mousemove', onMouseMove);
    if (gameActive) endGame(); // saiu do pointer lock no meio da partida
  }
});

renderer && renderer.domElement; // placeholder, real listener abaixo após init
document.addEventListener('click', () => {
  if (gameActive) onShoot();
});

// ================== LOOP DE ANIMAÇÃO ==================
function animate() {
  requestAnimationFrame(animate);

  if (gameActive && currentTarget) {
    if (performance.now() - targetSpawnTimestamp > TARGET_LIFETIME) {
      despawnAsMiss();
    }
    currentTarget.rotation.y += 0.02;
  }

  renderer.render(scene, camera);
}

// ================== BOOT ==================
initScene();
animate();
</script>
</body>
</html>
